name: Frontend CI/CD

on:
  pull_request:

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Auto-fix formatting
        run: bun run format

      - name: Commit formatting changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '🚨 Apply Prettier Change'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install && bun run quasar prepare

      - name: Run tests with coverage
        # --isolate: テストファイルごとに独立したグローバルを使う。`mock.module`はプロセス内で
        # 共有される（ファイルをまたいで永続する）ため、これが無いと他ファイルのモックが
        # 読み込み順序次第で本ファイルに漏れ、実装ではなくスタブを掴む・想定外の実処理が
        # 走るといった順序依存の不具合（実際にrun.test.tsが無期限にハングした）につながる
        run: bun test --isolate --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Coverage Report
        uses: 70-10/bun-coverage-report-action@v1.0.3
        with:
          lcov-path: coverage/lcov.info
          min-coverage: 80

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx vue-tsc --noEmit

  e2e:
    name: E2E (Playwright, ${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    # chromium（PWA相当）・electron（デスクトップアプリ相当）を別ジョブ（別VM＝別開発サーバー）
    # として並列実行する。同一プロセス内でworkers>1にすると、共有する開発サーバーへ複数の
    # ブラウザ/Electron contextが同時にIndexedDBアクセスし資源競合エラーが発生することを
    # 実測で確認したため（`playwright.config.ts`のworkers設定コメント参照）、並列化はプロセス/
    # ジョブ単位で行う
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, electron]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install && bun run quasar prepare

      - name: Install Playwright browser
        # electronプロジェクトでもPlaywright自身のChromiumは使わないが、`--with-deps`が
        # インストールするOS共有ライブラリ（libnss等）はElectron（Chromiumベース）の実行にも
        # 必要なため、両プロジェクト共通でこのステップを実行する
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb (electron project)
        if: matrix.project == 'electron'
        # LinuxでElectronの実ウィンドウを開くには仮想フレームバッファが必要
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run E2E tests (chromium)
        if: matrix.project == 'chromium'
        # PlaywrightのブラウザプロセスはOSのパイプ機構に依存し、Bunランタイム経由で起動すると
        # Windows環境では既知の不具合でハングする（chromium.launch()がタイムアウトする。
        # oven-sh/bun#27977等）。Linux CIでは再現しないが、切り離すためnpxで実行するNode.jsを
        # 使う（このジョブではactions/setup-nodeで導入済み）
        run: npx playwright test --project=chromium

      - name: Run E2E tests (electron)
        if: matrix.project == 'electron'
        run: xvfb-run -a npx playwright test --project=electron

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

  # セキュリティスキャンは現状GitHub Botに一任
